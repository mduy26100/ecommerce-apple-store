services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: apple-store-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "${MSSQL_PID}"
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: apple-store-db-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      DB_NAME: "${DB_NAME:-AppleStoreDb}"
    volumes:
      - ./seed-data.sql:/seed-data.sql:ro
    entrypoint: >
      /bin/bash -c "
      echo '[INIT] Kiểm tra kết nối SQL Server...';
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -I -Q \"SELECT 1\" > /dev/null 2>&1;
      echo '[INIT] Kiểm tra cơ sở dữ liệu $${DB_NAME}...';
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -I -Q \"
      IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$${DB_NAME}')
      BEGIN
          PRINT '[INIT] Chưa có database $${DB_NAME}. Đang tạo database...';
          CREATE DATABASE [$${DB_NAME}];
      END
      \";
      echo '[INIT] Kiểm tra dữ liệu sản phẩm trong database $${DB_NAME}...';
      HAS_DATA=\$(/opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -I -d \"$${DB_NAME}\" -h -1 -W -Q \"SET NOCOUNT ON; IF OBJECT_ID(N'[catalog].[Products]', N'U') IS NOT NULL SELECT COUNT(1) FROM [catalog].[Products]; ELSE SELECT 0;\");
      echo \"[INIT] Số sản phẩm hiện có: \$$HAS_DATA\";
      if [ \"\$$HAS_DATA\" = \"0\" ] || [ -z \"\$$HAS_DATA\" ]; then
          echo '[INIT] Cơ sở dữ liệu chưa có dữ liệu. Bắt đầu nạp seed-data.sql vào database $${DB_NAME}...';
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -I -d \"$${DB_NAME}\" -i /seed-data.sql;
          echo '[INIT] Nạp seed-data.sql hoàn tất!';
      else
          echo \"[INIT] Database $${DB_NAME} đã có dữ liệu (\$$HAS_DATA sản phẩm). Bỏ qua nạp seed-data.sql để bảo toàn dữ liệu.\";
      fi;
      echo '[INIT] Hoàn tất khởi tạo cơ sở dữ liệu. Sẵn sàng khởi động Backend.';
      "

  backend:
    container_name: apple-store-backend
    restart: unless-stopped
    build:
      context: ./apple-store-app
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      CorsSettings__AllowedOrigins__0: "${CORS_ORIGIN_FRONTEND}"
      CorsSettings__AllowedOrigins__1: "${CORS_ORIGIN_ALT1}"
      CorsSettings__AllowedOrigins__2: "${CORS_ORIGIN_ALT2}"
      CorsSettings__AllowedOrigins__3: "${CORS_ORIGIN_ALT3}"
      CloudinarySettings__CloudName: "${CLOUDINARY_CLOUD_NAME}"
      CloudinarySettings__ApiKey: "${CLOUDINARY_API_KEY}"
      CloudinarySettings__ApiSecret: "${CLOUDINARY_API_SECRET}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
      JwtSettings__AccessTokenExpirationMinutes: "${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}"
      JwtSettings__RefreshTokenExpirationDays: "${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}"
      VnPay__TmnCode: "${VNPAY_TMN_CODE}"
      VnPay__HashSecret: "${VNPAY_HASH_SECRET}"
      VnPay__PaymentUrl: "${VNPAY_PAYMENT_URL}"
      VnPay__ReturnUrl: "${VNPAY_RETURN_URL:-http://localhost:${BACKEND_PORT}/api/payment/vnpay-return}"
      VnPay__FrontendReturnUrl: "${VNPAY_FRONTEND_RETURN_URL:-http://localhost:${FRONTEND_PORT}/payment/vnpay-return}"
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    container_name: apple-store-frontend
    restart: unless-stopped
    build:
      context: ./apple-store-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    container_name: apple-store-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "backend:8080"
      - "--authtoken=${NGROK_AUTHTOKEN}"
      - "--log=stdout"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mssql_data:

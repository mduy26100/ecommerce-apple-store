services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: apple-store-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "${MSSQL_PID}"
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    container_name: apple-store-backend
    restart: unless-stopped
    build:
      context: ./apple-store-app
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      CorsSettings__AllowedOrigins__0: "${CORS_ORIGIN_FRONTEND}"
      CorsSettings__AllowedOrigins__1: "${CORS_ORIGIN_ALT1}"
      CorsSettings__AllowedOrigins__2: "${CORS_ORIGIN_ALT2}"
      CorsSettings__AllowedOrigins__3: "${CORS_ORIGIN_ALT3}"
      CloudinarySettings__CloudName: "${CLOUDINARY_CLOUD_NAME}"
      CloudinarySettings__ApiKey: "${CLOUDINARY_API_KEY}"
      CloudinarySettings__ApiSecret: "${CLOUDINARY_API_SECRET}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
      JwtSettings__AccessTokenExpirationMinutes: "${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}"
      JwtSettings__RefreshTokenExpirationDays: "${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}"
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./data-test.sql:/app/data-test.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    container_name: apple-store-frontend
    restart: unless-stopped
    build:
      context: ./apple-store-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
        VITE_USE_MOCK_API: "${VITE_USE_MOCK_API}"
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mssql_data:
